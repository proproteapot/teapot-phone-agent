name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  worker-tests:
    name: Cloudflare Worker Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test cloud/worker.test.cjs

  android-build:
    name: Android Debug APK Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run Unit Tests & Assemble Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: teapot-phone-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
